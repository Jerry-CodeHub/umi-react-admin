name: CI

# PR 时执行质量门禁（也可在 Actions 页手动触发）；master 的部署由 deploy.yml 负责。
# 不监听分支 push：同分支 push 与 PR 会双触发，被并发取消的那次会以 cancelled 留在 PR 检查列表里
on:
  pull_request:
  workflow_dispatch:

# 同一 PR 的新提交取消仍在运行的旧运行。
# group 用 PR 编号而非 head_ref（分支名）：外部 fork 可故意用与目标分支同名的分支开 PR，
# 与仓库分支共享 group 互相取消对方的运行（审计 2026-09-22 L-6，CI 可用性 DoS 面）
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# 最小权限（审计 2026-09-22 M-4）：PR 检查只需读取仓库内容，不依赖仓库默认的宽松 token 权限
permissions:
  contents: read

# 注：actions 按 commit SHA 钉固（注释保留版本号）；升级由 dependabot 提 PR（.github/dependabot.yml）
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm（读 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates（typecheck + 严格 lint + vitest，含 mock 可加载性）
        run: pnpm check

      - name: Dependency audit（非阻断观察期）
        # 两段式策略（决策 D7/D30）：先建立可见性，high 存量清零后转强制阻断
        run: pnpm audit --registry=https://registry.npmjs.org/ || true

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 两条产线都冒烟：主产线（Vercel/Docker）与 GitHub Pages 子路径产线
        script: [build, 'build:github']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm（读 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build smoke（${{ matrix.script }}，无需任何 secrets）
        run: pnpm run ${{ matrix.script }}

      - name: 体积预算与样式覆盖门禁
        if: matrix.script == 'build'
        run: node scripts/check-bundle-size.mjs

      - name: 产物 JWT 泄露扫描
        # 补审计 security-6 的盲区：曾发生 token 经 define 注入构建产物并部署到 gh-pages。
        # CI 构建不注入 secret，产物里除 Cesium 自带的公开默认 token 外出现任何 JWT 都判失败
        run: node scripts/check-dist-secrets.mjs
