# 安全响应头：由 default.conf 的每个 location include。
# nginx 中一旦 location 块自己写了 add_header，就不再继承 server 级的 add_header，
# 所以不能只在 server 块写一次。always：错误响应也带上。
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;

# CSP（审计 2026-09-22 H-3）：先以 Report-Only 观察一个迭代周期，确认无地图/富文本/播放器
# 白屏后再去掉 -Report-Only 后缀转正式。来源清单按产物逐域核实（与 vercel.json / config.github.ts 保持一致）：
# - 'unsafe-eval'：Cesium Knockout 模板编译用 new Function（实测在用），pdfjs 已关 isEvalSupported
# - style 'unsafe-inline'：AntD cssinjs 运行时注入 + tailwind 任意值
# - 高德/autonavi：react-amap JSONP；openstreetmap：InfoMap OSM 瓦片；ion.cesium.com：默认影像
# - virtualearth.net：未配置 ion token 时 Cesium 的 Bing 影像兜底（元数据 + 瓦片）。
#   注意瓦片协议跟随页面协议（uriScheme）：本站以 http 提供时 Cesium 会请求 http://ecn.t*.tiles…，
#   与 https:// 白名单不匹配（生产 https 部署不受影响）；配置了 ion token 的部署走 ion 影像，与此无关
# - alipayobjects/alicdn：appList 图标；huoshanstatic：xgplayer 演示视频（media-src）
# 启用 Clarity 统计的部署需在 script-src/connect-src/img-src 追加 https://www.clarity.ms https://c.bing.com
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-eval' https://*.amap.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gw.alipayobjects.com https://img.alicdn.com https://*.amap.com https://*.autonavi.com https://tile.openstreetmap.org https://ion.cesium.com https://api.cesium.com https://assets.ion.cesium.com https://*.virtualearth.net; connect-src 'self' blob: https://*.amap.com https://*.autonavi.com https://ion.cesium.com https://api.cesium.com https://assets.ion.cesium.com https://*.virtualearth.net; font-src 'self' data:; media-src 'self' https://sf1-cdn-tos.huoshanstatic.com; worker-src 'self' blob:; frame-src 'self'" always;

# HSTS：本服务监听 8080 明文（TLS 通常终止在上游 LB）。若本服务直接对外提供 HTTPS，
# 取消注释启用（max-age 按需调整；启用前确认所有子域均可 HTTPS 访问）：
