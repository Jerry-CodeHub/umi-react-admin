name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

# 最小权限（审计 2026-09-22 M-4）：部署需要写 gh-pages 分支；peaceiris action 持有的
# GITHUB_TOKEN 即受此约束，tag 劫持时的爆炸半径被限定在部署分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm（读 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Build
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          # 可选：为演示站开启 Clarity 统计时配置（模板默认不含任何统计脚本）
          CLARITY_ID: ${{ secrets.CLARITY_ID }}
        run: pnpm run build:github

      - name: SPA fallback（子路由直链/刷新不 404）
        # GitHub Pages 对不存在的路径返回站点根的 404.html；复制入口页即可让前端路由接管
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # 孤儿化部署：gh-pages 历史不累积（曾达 71 个提交/33MiB），
          # 且旧产物（含已泄露未轮换的历史 token）不再被新克隆拉取。
          # 注意：开启后首次部署将重建整棵部署树。
          force_orphan: true
