name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

# 构建不持有仓库写权限。只有下载已检查产物的发布 job 可以写 gh-pages。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 清单指纹（sha256）随 job 输出传给 deploy job：即使 artifact 里的清单被替换，校验也会失败
    outputs:
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm（读 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 质量门禁（typecheck / test / lint / audit）不在 master 部署上重跑：推到 master 的
      # commit 即 PR 上被 ci.yml 逐项检查过的同一 commit（分支保护要求 check/build/e2e 全绿），
      # 重复执行只增加约 6-8 分钟纯冗余。本工作流保留的是部署特有的门禁：凭据注入构建、
      # SPA 404 回退、dist 密钥扫描与完整性清单（扫描过的字节 = 发布的字节）。
      # 直推 master（不经 PR）的提交没有这道重复防线——分支保护已要求 PR 流程。

      - name: Build
        # 注入本产线会用到的全部凭据；扫描步骤必须看到同一组环境变量（否则「构建期配置了凭据」
        # 这一事实对扫描不可见，F3 的未声明检测就失效）
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          AMAP_SECURITY_CODE: ${{ secrets.AMAP_SECURITY_CODE }}
        run: pnpm run build:github:demo

      - name: SPA fallback（子路由直链/刷新不 404）
        # GitHub Pages 对不存在的路径返回站点根的 404.html；复制入口页即可让前端路由接管
        run: cp dist/index.html dist/404.html

      - name: Dist secrets scan（部署产物凭据扫描，成功才允许部署）
        # 审计 2026-09-22 H-1 + F3：扫描必须跑在注入凭据的同一份构建上，且每类凭据都要显式声明。
        # 此前扫描只在 ci.yml（不注入 secret 的构建）上跑，扫的产物与真正部署的产物不是同一份，
        # 门禁永真通过。EXPECTED_* 即本步骤注入的同名 secret：客户端地图应用的凭据设计上必然公开，
        # 脚本只以 sha256 指纹比对（不可逆、不落日志）。未声明、形态不合法、与构建期 define 不一致、
        # 声明了却在产物里找不到，都会判失败；除 Cesium 默认 token 与已声明凭据外的 JWT /
        # AWS/GitHub/PEM 等密钥特征一律判失败。
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          AMAP_SECURITY_CODE: ${{ secrets.AMAP_SECURITY_CODE }}
          EXPECTED_CESIUM_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          EXPECTED_AMAP_KEY: ${{ secrets.AMAP_KEY }}
          EXPECTED_AMAP_SECURITY_CODE: ${{ secrets.AMAP_SECURITY_CODE }}
        run: node scripts/check-dist-secrets.mjs

      - name: Generate integrity manifest（F10：把已扫描的字节钉成清单）
        # 逐文件 sha256 + 大小 + 目录结构写入 dist 之外的清单，并随 artifact 一起上传；
        # deploy job 下载后用它校验「发布的字节 == 扫描过的字节」。
        id: manifest
        run: |
          node scripts/verify-dist-integrity.mjs generate dist integrity-manifest.json
          echo "sha256=$(sha256sum integrity-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload checked static files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-pages
          # 清单与产物同属一个 artifact（清单必须在 dist 之外，见 verify-dist-integrity.mjs）
          path: |
            dist
            integrity-manifest.json
          # 不静默丢 dotfile：artifact 必须与清单覆盖的文件集完全一致，否则 deploy 端会判「缺文件」
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download checked static files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-pages
          path: .

      - name: Verify integrity before publish（F10：发布的字节必须等于扫描过的字节）
        # 先核对清单指纹与 build job 输出一致（防 artifact 中的清单被替换），再用清单逐文件校验 dist。
        # 缺文件、多文件、内容/大小变化、符号链接、目录结构或总大小变化都会在此失败，不会走到发布步骤。
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          actual="$(sha256sum integrity-manifest.json | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_MANIFEST_SHA256" ]; then
            echo "::error::下载到的清单指纹与 build job 生成的不一致（artifact 可能被替换或损坏）"
            exit 1
          fi
          node scripts/verify-dist-integrity.mjs verify dist integrity-manifest.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # 孤儿化部署：gh-pages 历史不累积（曾达 71 个提交/33MiB），
          # 且旧产物（含已泄露未轮换的历史 token）不再被新克隆拉取。
          # 注意：开启后首次部署将重建整棵部署树。
          force_orphan: true
          # 部署提交以机器人身份提交（默认用触发者身份，每次部署都会计入维护者的贡献图）
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium（部署后冒烟用）
        run: pnpm exec playwright install --with-deps chromium

      - name: 部署后冒烟（等待线上 version.json 切到本次提交，再跑 @smoke 用例）
        env:
          E2E_BASE_URL: https://jerry-codehub.github.io/umi-react-admin/
        run: |
          for i in $(seq 1 30); do
            sha=$(curl -fsSL "${E2E_BASE_URL}version.json?t=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).sha)}catch{}})") || true
            if [ "$sha" = "$GITHUB_SHA" ]; then echo "线上已是 $sha"; break; fi
            echo "等待 GitHub Pages 生效（当前 ${sha:-未知}）…"; sleep 20
          done
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::10 分钟内线上版本没有切到 $GITHUB_SHA"; exit 1; }
          pnpm exec playwright test --grep @smoke
