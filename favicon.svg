<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 标签页图标：logo.svg 的小尺寸版（按 32 网格重绘，16px 下主体线条 ≥1.25px）。
       去掉内环，加粗外环与扫描线，加深扫描扇区；目标点与中心点、扫描线都留出间隙，避免 16px 下糊成一团 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4096ff"/>
      <stop offset="1" stop-color="#0b3fbf"/>
    </linearGradient>
    <linearGradient id="sweep" x1="8.58" y1="0" x2="23.42" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <path d="M16 5.5v21M5.5 16h21" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
  <path d="M16 16L8.58 8.58A10.5 10.5 0 0 1 23.42 8.58z" fill="url(#sweep)"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="2.5"/>
  <path d="M16 16L23.42 8.58" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.25" fill="#fff"/>
  <circle cx="13.8" cy="9.9" r="2.2" fill="#5cdbd3"/>
</svg>
