# pnpm 配置（pnpm 11 起只读本文件；package.json#pnpm 与 .npmrc 的非鉴权项不再生效）

# 不提升传递依赖：源码只能引用 package.json 声明的包（repo-hygiene 门禁同步把关）。
# umi 自身经依赖链解析 react/antd 等，构建、dev、lint、测试均已在非提升布局下验证
shamefullyHoist: false
autoInstallPeers: true
strictPeerDependencies: false

# 依赖安装脚本：pnpm 10 起默认不执行，11 起未表态即报错。以下均维持「不执行」（与 pnpm 10 下的实际行为一致）：
# core-js / es5-ext 的 postinstall 只打印捐助或声明信息；esbuild 经平台 optionalDependencies 取得二进制，无需 postinstall
allowBuilds:
  core-js: false
  core-js-pure: false
  es5-ext: false
  esbuild: false

# 安全版本约束与未使用依赖删除；保留真实包版本，不通过 audit ignore 隐藏公告。
overrides:
  '@babel/core@<7.29.6': '7.29.6'
  '@babel/runtime@<7.26.10': '7.28.4'
  '@hono/node-server@<1.19.15': '1.19.15'
  '@remix-run/router@<1.23.3': '1.23.3'
  'axios@<1': '1.20.0'
  'baseline-browser-mapping@<2.11.0': '2.11.0'
  'body-parser@>=1.20.0 <1.20.6': '1.20.6'
  'brace-expansion@>=2.0.0 <2.1.7': '2.1.7'
  'brace-expansion@>=1.0.0 <1.1.21': '1.1.21'
  'braces@<3.0.3': '3.0.3'
  'browserslist@>=4.0.0 <4.28.7': '4.28.7'
  'colord@<2.9.4': '2.9.4'
  'compression@>=1.0.0 <1.8.2': '1.8.2'
  'cross-spawn@>=7.0.0 <7.0.5': '7.0.6'
  'dompurify@>=3.0.0 <3.4.17': '3.4.17'
  'es5-ext@<0.10.63': '0.10.64'
  'esbuild@<0.25.0': '0.25.12'
  'fast-uri@>=3.0.0 <3.1.8': '3.1.8'
  'follow-redirects@>=1.0.0 <1.16.2': '1.16.2'
  'form-data@>=4.0.0 <4.0.6': '4.0.6'
