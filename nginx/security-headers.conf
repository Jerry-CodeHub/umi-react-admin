# 安全响应头：由 default.conf 的每个 location include。
# nginx 中一旦 location 块自己写了 add_header，就不再继承 server 级的 add_header，
# 所以不能只在 server 块写一次。always：错误响应也带上。
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# CSP 未默认开启：地图（Cesium ion、高德）、第三方 CDN 媒体、Web Worker 等来源较多，
# 贸然开启容易大面积白屏。上线前按实际用到的来源收敛后再启用，例如：
# add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:" always;
