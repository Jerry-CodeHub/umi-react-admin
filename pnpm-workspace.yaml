  'webpack@<5.104.1': '5.104.1'
  'ws@>=8.0.0 <8.21.0': '8.21.0'
  'yaml@>=2.0.0 <2.8.3': '2.8.3'
  'yaml@<1.10.3': '1.10.3'
  # 模板使用自己的 ESLint/Stylelint/Vitest；正常 max setup/build/dev 不加载这些命令。
  '@umijs/max>@umijs/lint': '-'
  'umi>@umijs/test': '-'
  'exceljs>uuid': '11.1.1'
  'node-libs-browser>crypto-browserify': '-'
  'node-libs-browser-okam>crypto-browserify': '-'

# Runtime imports added by the real source patches below.
packageExtensions:
  'exceljs@4.4.0':
    dependencies:
      create-hash: '1.2.0'
      randombytes: '2.1.0'
  '@umijs/renderer-react@4.7.22':
    dependencies:
      react-router: '7.18.2'

# 真实源码补丁：锁文件固定 SHA256，scripts/dependency-security.test.ts 验证实际安装入口。
# braces 保持3.0.3，decode保持0.2.2，原始 audit 因版本匹配仍报告其公告。
patchedDependencies:
  'braces@3.0.3': patches/braces@3.0.3.patch
  'decode-uri-component@0.2.2': patches/decode-uri-component@0.2.2.patch
  'exceljs@4.4.0': patches/exceljs@4.4.0.patch
  'node-libs-browser@2.2.1': patches/node-libs-browser@2.2.1.patch
  'node-libs-browser-okam@2.2.5': patches/node-libs-browser-okam@2.2.5.patch
  '@umijs/renderer-react@4.7.22': patches/umijs__renderer-react@4.7.22.patch
  '@umijs/preset-umi@4.7.22': patches/umijs__preset-umi@4.7.22.patch
