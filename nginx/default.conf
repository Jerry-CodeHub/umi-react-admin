server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    # application/wasm：Cesium 第三方解码器；model/gltf-binary：public/assets 下的 glb 模型
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm model/gltf-binary;

    # 静态镜像不实现 API；缺失后端时明确失败，不能把 SPA HTML 当成接口成功。
    # 404 + JSON 与 scripts/serve-dist.mjs（GitHub Pages 等价本地服务器）、vercel.json 的 /api
    # 规则保持同一契约；三条产线的比对回归见 scripts/deploy-routing.test.ts。
    #
    # 用正则而不是 `location ^~ /api/`：前缀写法 `/api/` 不匹配裸 `/api`（也不匹配 `/api?x=1`，
    # 查询串不参与 location 匹配），这两条会落到下面 location / 的 try_files → 200 SPA HTML，
    # 正是 F6 要消除的失败模式（独立复审 2026-10-14 发现）。正则 location 优先于普通前缀
    # location，因此确定覆盖 /api、/api/、/api/v1/* 三种形态；契约内容见 api-fail-closed.conf。
    location ~ ^/api(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/api-fail-closed.conf;
    }

    # 入口：不缓存，发布即生效
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # pdf.js worker 是 ES module（.mjs）。nginx 自带的 mime.types 没有 mjs，默认按
    # application/octet-stream 下发会被浏览器拒绝执行（module 脚本严格校验 MIME）。
    # 不能在 server 级写 types 块补类型——那会整体替换 mime.types 映射表，所以在这里单独声明。
    location ~* "\.[0-9a-f]{8}\.mjs$" {
        default_type application/javascript;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 带内容哈希的构建产物（config.ts 已开 hash: true，如 umi.3f71652b.js、
    # p__Home__index.1a2b3c4d.async.js、432.9dcfe434.chunk.css）：内容变则文件名变，一年长缓存
    location ~* "\.[0-9a-f]{8}\.(?:async\.|chunk\.)?(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ttf)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 其余静态资源（Cesium 引擎资产、演示数据、图片等，文件名不带哈希）：每次向服务端协商（ETag），
    # 升级后不会命中旧文件；未命中任何文件时 SPA 回退到入口（深链如 /table 不 404）
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
