  'postcss@>=8.4.31 <8.5.23': '8.5.23'
  'postcss-selector-parser@<7.1.6': '7.1.6'
  'protobufjs@>=8.0.0 <8.6.6': '8.6.6'
  'protocol-buffers-schema@<3.6.1': '3.6.1'
  'proxy-addr@>=1.1.0 <2.0.8': '2.0.8'
